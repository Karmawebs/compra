<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6964eb"><title>Dani & Ly · Casa</title><style>:root{--bg:#f7f8ff;--ink:#171722;--muted:#8c8fa4;--line:#e2e5f2;--lav:#6964eb;--violet:#4938d6;--grad:linear-gradient(145deg,#86a8ff,#6964eb 48%,#4938d6)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}button,input{font:inherit}.shell{width:min(100%,430px);min-height:100dvh;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(92px + env(safe-area-inset-bottom))}.hidden{display:none!important}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;gap:12px;align-items:center}.logo,.hero{background:var(--grad);position:relative}.logo{width:48px;height:48px;border-radius:15px;box-shadow:0 8px 22px #4938d629}.logo:after,.hero:after{content:'••';position:absolute;color:white;letter-spacing:7px;font-size:22px;left:50%;top:48%;transform:translate(-50%,-50%)}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.title{font-size:25px;font-weight:650;letter-spacing:-.04em}.avatar{border:1px solid #d8dbee;background:#ffffff99;color:var(--violet);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700}.week{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.week h1,.shopping h1{margin:0;font-size:31px;line-height:.95;letter-spacing:-.055em}.week button{border:0;background:transparent;color:var(--violet);font-size:22px;padding:3px 7px}.days{display:flex;gap:8px;overflow:auto;padding-bottom:3px;margin-bottom:22px;scrollbar-width:none}.day{min-width:49px;padding:10px 6px;border:1px solid var(--line);border-radius:16px;text-align:center;background:#ffffff6b}.day b{display:block;font-size:12px}.day span{font-size:17px}.day.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 20px #4938d633}.meal{margin:0 0 24px}.meal h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin:0 0 9px;color:#71758a}.card{background:#ffffffdb;border:1px solid #dee1f2b8;border-radius:19px;padding:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 28px #47439d0f;margin-bottom:8px}.card strong{font-size:16px;font-weight:570}.card small{display:block;color:#9a9daf;margin-top:4px}.delete{border:0;background:transparent;color:var(--lav);font-size:20px;padding:4px}.empty{border:1px dashed #cdd2e8;border-radius:18px;padding:16px;color:#a1a5ba;font-size:14px;background:#ffffff3d}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:#f7f8ffe8;backdrop-filter:blur(18px);display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav button{border:0;border-radius:16px;padding:13px;background:transparent;color:#9699aa}.nav .active{background:var(--grad);color:white}.shopping h1{margin-bottom:18px}.new{display:flex;gap:8px;margin:18px 0}.new input,.login input{width:100%;border:0;border-bottom:1px solid #bfc4dd;background:transparent;padding:13px 2px;outline:none}.new button{border:0;background:var(--grad);color:white;border-radius:50%;min-width:42px;height:42px}.item{padding:15px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.item input{width:20px;height:20px;accent-color:var(--lav)}.item.done span{text-decoration:line-through;color:#a6a9b8}.clear{display:block;margin:22px auto;border:0;background:transparent;color:#999db1;font-size:12px}.login{min-height:80dvh;display:flex;flex-direction:column;justify-content:center}.hero{width:76px;height:76px;border-radius:24px;margin-bottom:20px;box-shadow:0 12px 30px #4938d62e}.login h1{font-size:34px;letter-spacing:-.05em;margin:0}.login p{color:var(--muted);margin:8px 0 30px}.login input{margin-bottom:16px}.primary{border:0;background:var(--grad);color:#fff;border-radius:16px;padding:14px;font-weight:650}.error{color:#b14b62;font-size:13px;margin-top:12px}.profile-pick{position:fixed;inset:0;background:#f7f8fff2;backdrop-filter:blur(15px);z-index:20;display:flex;align-items:center;justify-content:center;padding:28px}.profile-box{width:min(100%,380px);text-align:center}.profile-box h2{font-size:30px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:22px 10px;font-weight:700;color:var(--violet)}</style></head><body><main class="shell"><section id="login" class="login"><div class="hero"></div><div class="eyebrow">Nuestra casa</div><h1>Dani & Ly</h1><p>Menú semanal y lista de la compra compartidos.</p><form id="loginForm"><input id="email" type="email" autocomplete="email" placeholder="Email" required><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña" required><button class="primary" style="width:100%">Entrar</button></form><div id="loginError" class="error"></div></section><section id="app" class="hidden"><header class="top"><div class="brand"><div class="logo"></div><div><div class="eyebrow">Nuestra casa</div><div class="title">Dani & Ly</div></div></div><button id="avatar" class="avatar">...</button></header><section id="menu"><div class="week"><h1>Esta<br>semana</h1><div><button id="prevWeek">‹</button><button id="nextWeek">›</button></div></div><div id="days" class="days"></div><div id="meals"></div></section><section id="shopping" class="shopping hidden"><h1>Lista de<br>la compra</h1><div class="new"><input id="newItem" placeholder="Añadir producto…"><button id="addItem">+</button></div><div id="items"></div><button id="clearList" class="clear">Limpiar lista</button></section></section></main><nav id="nav" class="nav hidden"><button id="mBtn" class="active">Menú</button><button id="sBtn">Compra</button></nav><div id="profilePick" class="profile-pick hidden"><div class="profile-box"><div class="eyebrow">Primera vez</div><h2>¿Quién eres?</h2><p style="color:var(--muted)">Solo tendrás que elegirlo una vez.</p><div class="choices"><button data-profile="DANI">DANI</button><button data-profile="LY">LY</button></div><div id="profileError" class="error"></div></div></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://vjsmsekbsjngdtuxfbmu.supabase.co','sb_publishable_QQ_ZXbIAGm6_5bht6gWeMg_5kmk6oOW');let profile=null,weekStart=startMonday(new Date()),selected=new Date(),channel;const $=id=>document.getElementById(id);function iso(d){return d.toLocaleDateString('en-CA')}function startMonday(d){let x=new Date(d);x.setHours(12,0,0,0);let n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function init(){const{data:{session}}=await sb.auth.getSession();session?enter(session.user):showLogin()}function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden');$('nav').classList.add('hidden')}async function enter(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('nav').classList.remove('hidden');const{data}=await sb.from('compra_profiles').select('id,name,user_id').eq('user_id',user.id).maybeSingle();if(!data){$('profilePick').classList.remove('hidden');return}profile=data;$('avatar').textContent=profile.name;await refresh();subscribe()}$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginError').textContent='Email o contraseña incorrectos.';return}await enter(data.user)});document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=async()=>{const u=(await sb.auth.getUser()).data.user;const{data,error}=await sb.from('compra_profiles').update({user_id:u.id}).eq('name',b.dataset.profile).is('user_id',null).select().single();if(error){$('profileError').textContent='Ese perfil ya está vinculado. Elige el otro.';return}profile=data;$('avatar').textContent=profile.name;$('profilePick').classList.add('hidden');await refresh();subscribe()});$('avatar').onclick=async()=>{if(confirm('¿Cerrar sesión?')){await sb.auth.signOut();location.reload()}};function renderDays(){let names=['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];$('days').innerHTML='';for(let i=0;i<7;i++){let d=new Date(weekStart);d.setDate(d.getDate()+i);let el=document.createElement('button');el.className='day '+(iso(d)===iso(selected)?'active':'');el.innerHTML='<b>'+names[i]+'</b><span>'+d.getDate()+'</span>';el.onclick=()=>{selected=d;renderDays();loadMenu()};$('days').appendChild(el)}}async function loadMenu(){const{data,error}=await sb.from('compra_menu_items').select('*').eq('menu_date',iso(selected)).order('position');if(error)return;let map={breakfast:'Desayuno',lunch:'Comida',dinner:'Cena'},html='';for(const[type,label]of Object.entries(map)){let rows=data.filter(x=>x.meal_type===type);html+='<div class="meal"><h2>'+label+'</h2>';if(rows.length)rows.forEach(r=>html+='<div class="card"><div><strong>'+esc(r.title)+'</strong><small>Añadido por '+(r.created_by==='DANI'?'Dani':'Ly')+'</small></div><button class="delete" data-delmeal="'+r.id+'">×</button></div>');else html+='<div class="empty" data-addmeal="'+type+'">Añadir '+label.toLowerCase()+'</div>';html+='</div>'}$('meals').innerHTML=html;document.querySelectorAll('[data-addmeal]').forEach(e=>e.onclick=()=>addMeal(e.dataset.addmeal));document.querySelectorAll('[data-delmeal]').forEach(e=>e.onclick=()=>deleteMeal(e.dataset.delmeal))}async function addMeal(type){let title=prompt('¿Qué vais a comer?');if(!title?.trim())return;await sb.from('compra_menu_items').insert({menu_date:iso(selected),meal_type:type,title:title.trim(),created_by:profile.name});await loadMenu()}async function deleteMeal(id){await sb.from('compra_menu_items').delete().eq('id',id);await loadMenu()}async function loadShopping(){const{data,error}=await sb.from('compra_shopping_items').select('*').order('completed').order('created_at');if(error)return;$('items').innerHTML=data.map(x=>'<label class="item '+(x.completed?'done':'')+'"><input type="checkbox" data-check="'+x.id+'" '+(x.completed?'checked':'')+'><span>'+esc(x.title)+'</span></label>').join('');document.querySelectorAll('[data-check]').forEach(e=>e.onchange=async()=>{await sb.from('compra_shopping_items').update({completed:e.checked}).eq('id',e.dataset.check);loadShopping()})}async function addItem(){let v=$('newItem').value.trim();if(!v)return;await sb.from('compra_shopping_items').insert({title:v,created_by:profile.name});$('newItem').value='';loadShopping()}$('addItem').onclick=addItem;$('newItem').addEventListener('keydown',e=>{if(e.key==='Enter')addItem()});$('clearList').onclick=async()=>{if(confirm('¿Borrar toda la lista de la compra?')){await sb.from('compra_shopping_items').delete().not('id','is',null);loadShopping()}};$('prevWeek').onclick=()=>moveWeek(-7);$('nextWeek').onclick=()=>moveWeek(7);function moveWeek(n){weekStart.setDate(weekStart.getDate()+n);selected=new Date(weekStart);renderDays();loadMenu()}$('mBtn').onclick=()=>view('menu');$('sBtn').onclick=()=>view('shopping');function view(v){$('menu').classList.toggle('hidden',v!=='menu');$('shopping').classList.toggle('hidden',v!=='shopping');$('mBtn').classList.toggle('active',v==='menu');$('sBtn').classList.toggle('active',v==='shopping');if(v==='shopping')loadShopping()}async function refresh(){renderDays();await Promise.all([loadMenu(),loadShopping()])}function subscribe(){if(channel)return;channel=sb.channel('compra-live').on('postgres_changes',{event:'*',schema:'public',table:'compra_shopping_items'},loadShopping).on('postgres_changes',{event:'*',schema:'public',table:'compra_menu_items'},loadMenu).subscribe()}init();</script></body></html>
